services:
  hb_web:
    ports: []

  hb_ws:
    ports: []

  hb_app:
    environment:
      HB_WS_URL: "wss://app.budgetlove.de/ws"
      HB_TRUST_PROXY: "1"

  hb_proxy:
    image: caddy:2.8-alpine
    container_name: hb_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hb_web
      - hb_ws

volumes:
  caddy_data:
  caddy_config:
