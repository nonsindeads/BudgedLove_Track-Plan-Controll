server {
  listen 80;
  server_name _;
  client_max_body_size 32M;

  root /var/www/public;
  index index.php;

  location ~ /\.(?!well-known(?:/|$)) {
    return 404;
  }

  location ~* (^|/)(composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|phpinfo\.php)(/|$) {
    return 404;
  }

  location ~* ^/(wp-|wp/|wp-admin/|wp-content/|wp-includes/|wp-json/|wordpress/|xmlrpc\.php|vendor/|storage/|config/) {
    return 404;
  }

  location / {
    try_files $uri $uri/ @rewrite;
  }

  location @rewrite {
    # Map extensionless paths to matching .php if present, otherwise fall back to index.php
    if (-f $request_filename.php) {
      rewrite ^(.*)$ $1.php last;
    }
    rewrite ^ /index.php?$query_string last;
  }

  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass hb_app:9000;
  }
}
