server {
  listen 80;
  server_name _;

  root /var/www/public;
  index index.php;

  location / {
    try_files $uri $uri/ @rewrite;
  }

  location @rewrite {
    # Map extensionless paths to matching .php if present, otherwise fall back to index.php
    if (-f $request_filename.php) {
      rewrite ^(.*)$ $1.php last;
    }
    rewrite ^ /index.php?$query_string last;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass hb_app:9000;
  }
}
