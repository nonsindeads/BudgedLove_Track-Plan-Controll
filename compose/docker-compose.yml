services:
  hb_web:
    image: nginx:1.27-alpine
    container_name: hb_web
    ports:
      - "8085:80"
    volumes:
      - ../public:/var/www/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - hb_app

  hb_app:
    build:
      context: ..
      dockerfile: compose/php.Dockerfile
      args:
        WITH_ZIP: "1"
    image: hb_app_php
    container_name: hb_app
    working_dir: /var/www
    environment:
      HB_DB_DSN: "pgsql:host=hb_db;port=5432;dbname=haushaltsbuch"
      HB_DB_USER: "hb_app"
      HB_DB_PASS: "hb_app_pw_change_me"
      HB_WS_URL: "ws://192.168.178.252:8081"
      HB_WS_SECRET: "hb_ws_change_me"
    volumes:
      - ..:/var/www
      - /srv/haushaltsbuch/uploads:/srv/haushaltsbuch/uploads
    depends_on:
      - hb_db

  hb_ws:
    build:
      context: ..
      dockerfile: compose/php.Dockerfile
      args:
        WITH_ZIP: "1"
    image: hb_app_php
    container_name: hb_ws
    working_dir: /var/www
    command: sh -c "if [ ! -d vendor ]; then composer install --no-dev --no-interaction --prefer-dist; fi; php app/ws/server.php start"
    environment:
      HB_DB_DSN: "pgsql:host=hb_db;port=5432;dbname=haushaltsbuch"
      HB_DB_USER: "hb_app"
      HB_DB_PASS: "hb_app_pw_change_me"
      HB_WS_SECRET: "hb_ws_change_me"
      HB_WS_BIND: "websocket://0.0.0.0:8081"
    volumes:
      - ..:/var/www
    ports:
      - "8081:8081"
    depends_on:
      - hb_db

  hb_db:
    image: postgres:16
    container_name: hb_db
    environment:
      POSTGRES_DB: "haushaltsbuch"
      POSTGRES_USER: "hb_app"
      POSTGRES_PASSWORD: "hb_app_pw_change_me"
    volumes:
      - /srv/haushaltsbuch/data/postgres:/var/lib/postgresql/data
