openapi: 3.0.3
info:
  title: BudgetLove API
  version: 0.25.5
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /api/meta.php:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/receipts.php:
    post:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/transactions.php:
    post:
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
