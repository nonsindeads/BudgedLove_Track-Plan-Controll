openapi: 3.1.0
info:
  title: BudgetLove Planning GPT API
  version: 0.30.5
  description: >
    Actions for the BudgetLove planning GPT: planned payments, open cases, recurring rules, reference data, and analytics. Supports Bearer tokens now and OAuth later.
servers:
  - url: https://app.budgetlove.de
security:
  - bearerAuth: []
  - oauth2Auth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: BudgetLove API token
      description: BudgetLove API token from Household > Settings > API Tokens.
    oauth2Auth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.budgetlove.de/api/oauth/authorize.php
          tokenUrl: https://app.budgetlove.de/api/oauth/token.php
          refreshUrl: https://app.budgetlove.de/api/oauth/token.php
          scopes:
            transactions:read: Read transactions
            transactions:write: Create/update transactions
            transactions:delete: Delete transactions
            analytics:read: Read analytics and summaries
            receipts:read: Read receipts
            receipts:write: Process and manage receipts
            planned:read: Read planned payments
            planned:write: Create/manage planned payments
            cases:read: Read open cases
            cases:write: Create/manage open cases
            recurring:read: Read recurring rules
            recurring:write: Create/manage recurring rules
            categories:read: Read categories
            categories:write: Create/manage/reassign categories
            payees:read: Read payees
            payees:write: Create/manage payees
            tags:read: Read tags
            tags:write: Create/manage tags
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable error message.
          required:
            - code
            - message
        request_id:
          type:
            - string
            - "null"
          description: Request correlation id for logs and support.
      required:
        - error
        - request_id
    CategoryListResponse:
      type: object
      additionalProperties: false
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - categories
        - limit
        - offset
        - total
    CategoryResponse:
      type: object
      additionalProperties: false
      properties:
        category:
          $ref: "#/components/schemas/Category"
      required:
        - category
    CategoryCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Category name.
        parent_id:
          type:
            - integer
            - "null"
          description: Optional parent category id for hierarchical categories.
      required:
        - name
    CategoryUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Updated category name.
        parent_id:
          type:
            - integer
            - "null"
          description: Updated parent category id.
        is_active:
          type: boolean
          description: Updated active status.
    CategoryBulkReassignRequest:
      type: object
      additionalProperties: false
      properties:
        from_category_id:
          type: integer
          description: Source category id to reassign from.
        to_category_id:
          type: integer
          description: Target category id to reassign to.
      required:
        - from_category_id
        - to_category_id
    CategoryBulkReassignResponse:
      type: object
      additionalProperties: false
      properties:
        reassigned_count:
          type: integer
          description: Number of transactions reassigned.
      required:
        - reassigned_count
    Category:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: BudgetLove category id.
        name:
          type: string
          description: Category display name.
        parent_id:
          type:
            - integer
            - "null"
          description: Parent category id for hierarchical categories.
        is_active:
          type: boolean
          description: Whether the category is active.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the category was created.
      required:
        - id
        - name
        - parent_id
        - is_active
        - created_at
    Account:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: BudgetLove account id.
        name:
          type: string
          description: Account display name.
        current_balance_cents:
          type: integer
          description: Current account balance in cents as returned by BudgetLove.
      required:
        - id
        - name
        - current_balance_cents
    Payee:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: BudgetLove payee id.
        name:
          type: string
          description: Payee display name.
      required:
        - id
        - name
    Tag:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: BudgetLove tag id.
        name:
          type: string
          description: Tag display name.
        color:
          type:
            - string
            - "null"
          description: Optional tag color.
      required:
        - id
        - name
        - color
    Relation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
      required:
        - id
        - name
    Transaction:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - income
            - expense
            - transfer
        date:
          type: string
          format: date
        amount_cents:
          type: integer
        amount:
          type: number
        currency_code:
          type: string
        account:
          oneOf:
            - $ref: "#/components/schemas/Relation"
            - type: "null"
        category:
          oneOf:
            - $ref: "#/components/schemas/Relation"
            - type: "null"
        payee:
          oneOf:
            - $ref: "#/components/schemas/Relation"
            - type: "null"
        counterparty_name:
          type:
            - string
            - "null"
        notes:
          type:
            - string
            - "null"
        is_reviewed:
          type: boolean
        external_id:
          type:
            - string
            - "null"
        import_hash:
          type:
            - string
            - "null"
        planned_payment_id:
          type:
            - integer
            - "null"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - type
        - date
        - amount_cents
        - amount
        - currency_code
        - account
        - category
        - payee
        - counterparty_name
        - notes
        - is_reviewed
        - external_id
        - import_hash
        - planned_payment_id
        - tags
        - created_at
        - updated_at
    TransactionListResponse:
      type: object
      additionalProperties: false
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - transactions
        - limit
        - offset
        - total
    TransactionResponse:
      type: object
      additionalProperties: false
      properties:
        transaction:
          $ref: "#/components/schemas/Transaction"
      required:
        - transaction
    MetaResponse:
      type: object
      additionalProperties: false
      properties:
        month:
          type: string
          description: Current month as two digits.
          examples:
            - "05"
        year:
          type: string
          description: Current year.
          examples:
            - "2026"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        payees:
          type: array
          items:
            $ref: "#/components/schemas/Payee"
          description: All active payees for the household.
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
          description: All active tags for the household.
      required:
        - month
        - year
        - categories
        - accounts
        - payees
        - tags
    TransactionCreateRequest:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          description: Positive amount in EUR, for example 12.99.
        date:
          type: string
          format: date
          description: Booking date as YYYY-MM-DD.
        type:
          type: string
          enum:
            - income
            - expense
          description: Optional transaction type. Defaults to expense.
        account_id:
          type: integer
          description: Account id from getBudgetLoveMetadata.
        category_id:
          type: integer
          description: Optional category id from getBudgetLoveMetadata. Omit if uncertain.
        payee_id:
          type: integer
          description: Optional payee id from BudgetLove.
        payee:
          type: string
          description: Optional payee or merchant name.
        counterparty_name:
          type: string
          description: Optional raw counterparty or merchant name.
        notes:
          type: string
          description: Optional note. Include relevant context and mark GPT-created bookings.
        is_reviewed:
          type: boolean
          description: Optional reviewed flag. Defaults to true.
        tag_ids:
          type: array
          items:
            type: integer
          description: Optional tag ids from BudgetLove.
        attachment_id:
          type: integer
          description: Optional attachment id from processBudgetLoveReceipt to link the stored receipt file to this draft.
      required:
        - amount
        - date
        - account_id
    TransactionCreateResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Created transaction id.
        amount_cents:
          type: integer
          description: Created amount in cents.
        date:
          type: string
          format: date
          description: Booking date.
      required:
        - id
        - amount_cents
        - date
    TransactionUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - income
            - expense
        date:
          type: string
          format: date
        amount:
          type: number
          exclusiveMinimum: 0
        account_id:
          type:
            - integer
            - "null"
        category_id:
          type:
            - integer
            - "null"
        payee_id:
          type:
            - integer
            - "null"
        payee:
          type:
            - string
            - "null"
        counterparty_name:
          type:
            - string
            - "null"
        notes:
          type:
            - string
            - "null"
        is_reviewed:
          type:
            - boolean
            - "null"
        tag_ids:
          type: array
          items:
            type: integer
    TransactionDraftCreateRequest:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          description: Positive amount in EUR, for example 12.99.
        date:
          type: string
          format: date
          description: Receipt or expected booking date as YYYY-MM-DD.
        type:
          type: string
          enum:
            - expense
            - income
          description: Draft type. Use expense for normal receipts.
        account_id:
          type: integer
          description: Optional account id from getBudgetLoveMetadata. Omit if the real bank account is not certain yet.
        category_id:
          type: integer
          description: Optional category id from getBudgetLoveMetadata. Omit if uncertain.
        payee:
          type: string
          description: Optional merchant/payee name from the receipt.
        notes:
          type: string
          description: Optional note or OCR summary. The API marks the entry as a receipt draft.
        tag_ids:
          type: array
          items:
            type: integer
          description: Optional tag ids from BudgetLove.
      required:
        - amount
        - date
    TransactionDraftCreateResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Created draft transaction id.
        amount_cents:
          type: integer
          description: Draft amount in cents.
        date:
          type: string
          format: date
          description: Draft date.
        is_reviewed:
          type: boolean
          description: Always false for drafts.
        status:
          type: string
          enum:
            - draft
        attachment_id:
          type:
            - integer
            - "null"
          description: Linked attachment id when provided.
        receipt_id:
          type:
            - integer
            - "null"
          description: Linked receipt id when provided.
      required:
        - id
        - amount_cents
        - date
        - is_reviewed
        - status
    ReceiptProcessRequest:
      type: object
      additionalProperties: false
      properties:
        image_base64:
          type: string
          description: Base64 encoded receipt image. If unavailable, do not call this endpoint.
      required:
        - image_base64
    ReceiptProcessResponse:
      type: object
      additionalProperties: false
      properties:
        amount:
          type:
            - number
            - "null"
          description: Extracted amount in EUR, if detected.
        date:
          type:
            - string
            - "null"
          format: date
          description: Extracted receipt date as YYYY-MM-DD, if detected.
        payee:
          type:
            - string
            - "null"
          description: Extracted payee or merchant, if detected.
        suggested_category:
          type:
            - string
            - "null"
          description: Suggested category name, if detected.
        raw_text:
          type: string
          description: Raw OCR text. May be empty if OCR is unavailable.
        attachment_id:
          type: integer
          description: Stored receipt attachment id.
        attachment_path:
          type: string
          description: Relative attachment storage path.
        mime_type:
          type: string
          description: MIME type of stored file.
        size_bytes:
          type: integer
          description: Stored file size in bytes.
        receipt_id:
          type: integer
          description: Created receipt id.
        receipt:
          $ref: "#/components/schemas/Receipt"
      required:
        - amount
        - date
        - payee
        - suggested_category
        - raw_text
        - attachment_id
        - attachment_path
        - mime_type
        - size_bytes
        - receipt_id
        - receipt
    Receipt:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        merchant:
          type:
            - string
            - "null"
        receipt_date:
          type:
            - string
            - "null"
          format: date
        total_amount_cents:
          type:
            - integer
            - "null"
        total_amount:
          type:
            - number
            - "null"
        currency_code:
          type: string
        file_path:
          type:
            - string
            - "null"
        storage_key:
          type:
            - string
            - "null"
        file_hash:
          type:
            - string
            - "null"
        mime_type:
          type:
            - string
            - "null"
        ocr_json:
          type:
            - object
            - "null"
          additionalProperties: true
        status:
          type: string
          enum:
            - draft
            - matched
            - archived
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - merchant
        - receipt_date
        - total_amount_cents
        - total_amount
        - currency_code
        - status
        - created_at
        - updated_at
    ReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: "#/components/schemas/Receipt"
      required:
        - receipt
    ReceiptListResponse:
      type: object
      additionalProperties: false
      properties:
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/Receipt"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - receipts
        - limit
        - offset
        - total
    ReceiptUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        merchant:
          type:
            - string
            - "null"
        receipt_date:
          type:
            - string
            - "null"
          format: date
        total_amount:
          type:
            - number
            - "null"
        status:
          type: string
          enum:
            - draft
            - matched
            - archived
        ocr_json:
          type:
            - object
            - "null"
          additionalProperties: true
    TransactionSplit:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        transaction_id:
          type:
            - integer
            - "null"
        amount_cents:
          type: integer
        amount:
          type: number
        category:
          anyOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
        note:
          type:
            - string
            - "null"
        sort_order:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - transaction_id
        - amount_cents
        - amount
        - category
        - sort_order
        - created_at
        - updated_at
    TransactionGroup:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        receipt_id:
          type:
            - integer
            - "null"
        account:
          anyOf:
            - $ref: "#/components/schemas/Account"
            - type: "null"
        payee:
          anyOf:
            - $ref: "#/components/schemas/Payee"
            - type: "null"
        payee_text:
          type:
            - string
            - "null"
        booking_date:
          type: string
          format: date
        total_amount_cents:
          type: integer
        total_amount:
          type: number
        currency_code:
          type: string
        type:
          type: string
          enum:
            - expense
            - income
        notes:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - draft
            - booked
            - archived
        external_id:
          type:
            - string
            - "null"
        import_hash:
          type:
            - string
            - "null"
        matched_transaction_id:
          type:
            - integer
            - "null"
        splits:
          type: array
          items:
            $ref: "#/components/schemas/TransactionSplit"
        split_total_cents:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - booking_date
        - total_amount_cents
        - total_amount
        - currency_code
        - type
        - status
        - splits
        - split_total_cents
        - created_at
        - updated_at
    TransactionGroupResponse:
      type: object
      additionalProperties: false
      properties:
        transaction_group:
          $ref: "#/components/schemas/TransactionGroup"
      required:
        - transaction_group
    TransactionGroupListResponse:
      type: object
      additionalProperties: false
      properties:
        transaction_groups:
          type: array
          items:
            $ref: "#/components/schemas/TransactionGroup"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - transaction_groups
        - limit
        - offset
        - total
    TransactionGroupSplitInput:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        category_id:
          type:
            - integer
            - "null"
        note:
          type:
            - string
            - "null"
        sort_order:
          type: integer
      required:
        - amount
    CreateTransactionGroupRequest:
      type: object
      additionalProperties: false
      properties:
        receipt_id:
          type:
            - integer
            - "null"
        account_id:
          type:
            - integer
            - "null"
        payee_id:
          type:
            - integer
            - "null"
        payee:
          type:
            - string
            - "null"
        booking_date:
          type: string
          format: date
        type:
          type: string
          enum:
            - expense
            - income
        total_amount:
          type: number
          exclusiveMinimum: 0
        currency_code:
          type: string
          default: EUR
        notes:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - draft
            - booked
        splits:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TransactionGroupSplitInput"
      required:
        - booking_date
        - total_amount
        - splits
    UpdateTransactionGroupRequest:
      type: object
      additionalProperties: false
      properties:
        receipt_id:
          type:
            - integer
            - "null"
        account_id:
          type:
            - integer
            - "null"
        payee_id:
          type:
            - integer
            - "null"
        payee:
          type:
            - string
            - "null"
        booking_date:
          type: string
          format: date
        total_amount:
          type: number
          exclusiveMinimum: 0
        notes:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - draft
            - booked
            - archived
        splits:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TransactionGroupSplitInput"
    PayeeResponse:
      type: object
      additionalProperties: false
      properties:
        payee:
          $ref: "#/components/schemas/Payee"
      required:
        - payee
    PayeeListResponse:
      type: object
      additionalProperties: false
      properties:
        payees:
          type: array
          items:
            $ref: "#/components/schemas/Payee"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - payees
        - limit
        - offset
        - total
    PayeeCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Payee name.
      required:
        - name
    PayeeUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Updated payee name.
    TagResponse:
      type: object
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/Tag"
      required:
        - tag
    TagListResponse:
      type: object
      additionalProperties: false
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - tags
        - limit
        - offset
        - total
    TagCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Tag name.
        color:
          type:
            - string
            - "null"
          description: Optional hex color code or color name.
      required:
        - name
    TagUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Updated tag name.
        color:
          type:
            - string
            - "null"
          description: Updated hex color code or color name, or null to remove color.
    PlannedPayment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        direction:
          type: string
          enum:
            - income
            - expense
        amount_cents:
          type: integer
        amount:
          type: number
        planned_date:
          type: string
          format: date
        status:
          type: string
          enum:
            - open
            - done
            - resolved
            - skipped
            - overdue
            - suggested
            - cancelled
        priority:
          type: integer
        is_optional:
          type: boolean
        account_id:
          type:
            - integer
            - "null"
        category_id:
          type:
            - integer
            - "null"
        payee_id:
          type:
            - integer
            - "null"
        note:
          type:
            - string
            - "null"
        resolved_at:
          type:
            - string
            - "null"
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - name
        - direction
        - amount_cents
        - amount
        - planned_date
        - status
        - priority
        - is_optional
        - account_id
        - category_id
        - payee_id
        - note
        - resolved_at
        - created_at
        - updated_at
    PlannedPaymentListResponse:
      type: object
      additionalProperties: false
      properties:
        planned_payments:
          type: array
          items:
            $ref: "#/components/schemas/PlannedPayment"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - planned_payments
        - limit
        - offset
