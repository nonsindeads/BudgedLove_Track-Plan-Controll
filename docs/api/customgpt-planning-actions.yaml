paths:
  /api/meta.php:
    get:
      operationId: getBudgetLoveMetadata
      summary: Get BudgetLove accounts and categories
      description: >
        Fetch accounts, categories and current date context for the token user's
        household. Call this before creating any transaction so that valid IDs
        are used.
      security:
        - bearerAuth: []
        - oauth2Auth: [categories:read, payees:read, tags:read]
      responses:
        "200":
          description: Metadata for the current household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Token user is not linked to a household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/planned_payments.php:
    get:
      operationId: listBudgetLovePlannedPayments
      summary: List planned payments
      description: >
        Fetch planned payments for analysis and planning. Use this to see
        upcoming expenses or income, and their current status.
      security:
        - bearerAuth: []
        - oauth2Auth: [planned:read]
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: Return a single planned payment by id.
        - in: query
          name: status
          schema:
            type: string
            enum:
              - open
              - resolved
              - done
              - skipped
              - overdue
              - suggested
              - cancelled
          description: >
            Filter by status. Backward compatible: resolved and done are treated as equivalent.
        - in: query
          name: direction
          schema:
            type: string
            enum:
              - income
              - expense
          description: Filter by direction.
        - in: query
          name: date_from
          schema:
            type: string
            format: date
          description: Filter from planned date.
        - in: query
          name: date_to
          schema:
            type: string
            format: date
          description: Filter to planned date.
        - in: query
          name: account_id
          schema:
            type: integer
        - in: query
          name: category_id
          schema:
            type: integer
        - in: query
          name: payee_id
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Planned payment list or single payment.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlannedPaymentListResponse"
                  - $ref: "#/components/schemas/PlannedPaymentResponse"
        "400":
          description: Invalid filter parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing required scope (planned:read).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Planned payment not found (when querying by id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBudgetLovePlannedPayment
      summary: Create a planned payment
      description: >
        Create a planned payment entry for upcoming income or expense.
      security:
        - bearerAuth: []
        - oauth2Auth: [planned:write]
      x-openai-isConsequential: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Unique key to safely retry write requests without duplicate effects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannedPaymentCreateRequest"
      responses:
        "201":
          description: Planned payment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedPaymentResponse"
        "400":
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing required scope (planned:write).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Idempotency key reused with different request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBudgetLovePlannedPayment
      summary: Update a planned payment
      description: >
        Update an existing planned payment by id.
      security:
        - bearerAuth: []
        - oauth2Auth: [planned:write]
      x-openai-isConsequential: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Unique key to safely retry write requests without duplicate effects.
        - in: query
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannedPaymentUpdateRequest"
      responses:
        "200":
          description: Planned payment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedPaymentResponse"
        "400":
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing required scope (planned:write).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Planned payment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Idempotency key reused with different request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBudgetLovePlannedPayment
      summary: Delete a planned payment
      description: Delete an existing planned payment by id.
      security:
        - bearerAuth: []
        - oauth2Auth: [planned:write]
      x-openai-isConsequential: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Unique key to safely retry write requests without duplicate effects.
        - in: query
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  deleted:
                    type: boolean
                required:
                  - deleted
        "400":
          description: Missing id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing required scope (planned:write).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Planned payment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Idempotency key reused with different request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/open_cases.php:
    get:
      operationId: listBudgetLoveOpenCases
      summary: List open cases
      description: >
        Fetch open cases for tracking outstanding items, claims, or follow-ups.
        Use this to check status of unresolved matters.
      security:
        - bearerAuth: []
        - oauth2Auth: [cases:read]
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: Return a single open case by id.
        - in: query
          name: status
          schema:
            type: string
            enum:
              - open
              - resolved
              - cancelled
          description: Filter by status.
        - in: query
          name: q
          schema:
            type: string
          description: Search by title, reference, contact name or notes.
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Open case list or single case.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OpenCaseListResponse"
                  - $ref: "#/components/schemas/OpenCaseResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Open case not found (when querying by id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBudgetLoveOpenCase
      summary: Create an open case
      description: Create a new open case entry.
      security:
        - bearerAuth: []
        - oauth2Auth: [cases:write]
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenCaseCreateRequest"
      responses:
        "201":
          description: Open case created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenCaseResponse"
        "400":
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBudgetLoveOpenCase
      summary: Update an open case
      description: Update an existing open case by id.
      security:
        - bearerAuth: []
        - oauth2Auth: [cases:write]
      x-openai-isConsequential: true
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenCaseUpdateRequest"
      responses:
        "200":
          description: Open case updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenCaseResponse"
        "400":
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Open case not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBudgetLoveOpenCase
      summary: Delete an open case
      description: Delete an existing open case by id.
      security:
        - bearerAuth: []
        - oauth2Auth: [cases:write]
      x-openai-isConsequential: true
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  deleted:
                    type: boolean
                required:
                  - deleted
        "400":
          description: Missing id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/recurring_rules.php:
    get:
      operationId: listBudgetLoveRecurringRules
      summary: List recurring rules
      description: >
        Fetch recurring rules (repeated transactions or payments) for the household.
        Use this to see what is scheduled and when the next execution is planned.
      security:
        - bearerAuth: []
        - oauth2Auth: [recurring:read]
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: Return a single recurring rule by id.
        - in: query
          name: active
          schema:
            type: boolean
          description: Filter by active status.
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - transaction
              - payment
          description: Filter by rule type.
        - in: query
          name: q
          schema:
            type: string
          description: Search by rule name.
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Recurring rule list or single rule.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RecurringRuleListResponse"
                  - $ref: "#/components/schemas/RecurringRuleResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recurring rule not found (when querying by id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/analytics.php:
    get:
      operationId: getBudgetLoveAnalytics
      summary: Get analytics and summary data
      description: >
        Fetch analytics data such as monthly summaries, category breakdowns,
        open planned payments, and duplicate candidates. Use the endpoint
        parameter to select what data to retrieve.
      security:
        - bearerAuth: []
        - oauth2Auth: [analytics:read]
      parameters:
        - in: query
          name: endpoint
          schema:
            type: string
            enum:
              - month_summary
              - open_planned
              - duplicate_candidates
            default: month_summary
          description: Which analytics endpoint to query.
        - in: query
          name: month
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Month for month_summary (default current month).
        - in: query
          name: year
          schema:
            type: integer
            minimum: 2000
            maximum: 2999
          description: Year for month_summary (default current year).
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
          description: Days window for duplicate_candidates detection (default 7).
      responses:
        "200":
          description: Analytics data.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request or invalid endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/categories:
    get:
      operationId: listBudgetLoveCategories
      summary: List or search categories
      description: >
        Fetch categories for the household. Use this to find category IDs for
        transactions or to inspect the category hierarchy.
      security:
        - bearerAuth: []
        - oauth2Auth: [categories:read]
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: Return a single category by id.
        - in: query
          name: q
          schema:
            type: string
          description: Search categories by name.
        - in: query
          name: active
          schema:
            type: boolean
          description: Filter by active status.
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Category list or a single category.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CategoryListResponse"
                  - $ref: "#/components/schemas/CategoryResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Category not found (when querying by id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBudgetLoveCategory
      summary: Create a new category
      description: >
        Create a new category in BudgetLove. Optionally set a parent category
        to create a hierarchical structure.
      security:
        - bearerAuth: []
        - oauth2Auth: [categories:write]
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          description: Invalid request or unknown parent category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Category already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/payees.php:
    get:
      operationId: listBudgetLovePayees
      summary: List or search payees
      description: >
        Fetch payees for the household. Use this to find payee IDs for
        transactions or to verify payee names.
      security:
        - bearerAuth: []
        - oauth2Auth: [payees:read]
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: Return a single payee by id.
        - in: query
          name: q
