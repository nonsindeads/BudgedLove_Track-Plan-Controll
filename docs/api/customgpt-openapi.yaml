openapi: 3.1.0
info:
  title: BudgetLove Custom GPT API
  version: 0.28.0
  description: >
    API schema for connecting a Custom GPT to BudgetLove through GPT Actions.
    Use this schema in the GPT Builder Actions section. The API requires a
    BudgetLove API token and only operates on the household linked to that token.
servers:
  - url: https://app.budgetlove.de
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: BudgetLove API token
      description: BudgetLove API token from Household > Settings > API Tokens.
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          description: Human-readable error message.
      required:
        - error
    Category:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: BudgetLove category id.
        name:
          type: string
          description: Category display name.
      required:
        - id
        - name
    Account:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: BudgetLove account id.
        name:
          type: string
          description: Account display name.
        current_balance_cents:
          type: integer
          description: Current account balance in cents as returned by BudgetLove.
      required:
        - id
        - name
        - current_balance_cents
    Payee:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: BudgetLove payee id.
        name:
          type: string
          description: Payee display name.
      required:
        - id
        - name
    Tag:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: BudgetLove tag id.
        name:
          type: string
          description: Tag display name.
        color:
          type:
            - string
            - "null"
          description: Optional tag color.
      required:
        - id
        - name
        - color
    Relation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
      required:
        - id
        - name
    Transaction:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - income
            - expense
            - transfer
        date:
          type: string
          format: date
        amount_cents:
          type: integer
        amount:
          type: number
        currency_code:
          type: string
        account:
          oneOf:
            - $ref: "#/components/schemas/Relation"
            - type: "null"
        category:
          oneOf:
            - $ref: "#/components/schemas/Relation"
            - type: "null"
        payee:
          oneOf:
            - $ref: "#/components/schemas/Relation"
            - type: "null"
        counterparty_name:
          type:
            - string
            - "null"
        notes:
          type:
            - string
            - "null"
        is_reviewed:
          type: boolean
        external_id:
          type:
            - string
            - "null"
        import_hash:
          type:
            - string
            - "null"
        planned_payment_id:
          type:
            - integer
            - "null"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - type
        - date
        - amount_cents
        - amount
        - currency_code
        - account
        - category
        - payee
        - counterparty_name
        - notes
        - is_reviewed
        - external_id
        - import_hash
        - planned_payment_id
        - tags
        - created_at
        - updated_at
    TransactionListResponse:
      type: object
      additionalProperties: false
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - transactions
        - limit
        - offset
        - total
    TransactionResponse:
      type: object
      additionalProperties: false
      properties:
        transaction:
          $ref: "#/components/schemas/Transaction"
      required:
        - transaction
    MetaResponse:
      type: object
      additionalProperties: false
      properties:
        month:
          type: string
          description: Current month as two digits.
          examples:
            - "05"
        year:
          type: string
          description: Current year.
          examples:
            - "2026"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        payees:
          type: array
          items:
            $ref: "#/components/schemas/Payee"
          description: All active payees for the household.
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
          description: All active tags for the household.
      required:
        - month
        - year
        - categories
        - accounts
        - payees
        - tags
    TransactionCreateRequest:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          description: Positive amount in EUR, for example 12.99.
        date:
          type: string
          format: date
          description: Booking date as YYYY-MM-DD.
        type:
          type: string
          enum:
            - income
            - expense
          description: Optional transaction type. Defaults to expense.
        account_id:
          type: integer
          description: Account id from getBudgetLoveMetadata.
        category_id:
          type: integer
          description: Optional category id from getBudgetLoveMetadata. Omit if uncertain.
        payee_id:
          type: integer
          description: Optional payee id from BudgetLove.
        payee:
          type: string
          description: Optional payee or merchant name.
        counterparty_name:
          type: string
          description: Optional raw counterparty or merchant name.
        notes:
          type: string
          description: Optional note. Include relevant context and mark GPT-created bookings.
        is_reviewed:
          type: boolean
          description: Optional reviewed flag. Defaults to true.
        tag_ids:
          type: array
          items:
            type: integer
          description: Optional tag ids from BudgetLove.
      required:
        - amount
        - date
        - account_id
    TransactionCreateResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Created transaction id.
        amount_cents:
          type: integer
          description: Created amount in cents.
        date:
          type: string
          format: date
          description: Booking date.
      required:
        - id
        - amount_cents
        - date
    TransactionUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - income
            - expense
        date:
          type: string
          format: date
        amount:
          type: number
          exclusiveMinimum: 0
        account_id:
          type:
            - integer
            - "null"
        category_id:
          type:
            - integer
            - "null"
        payee_id:
          type:
            - integer
            - "null"
        payee:
          type:
            - string
            - "null"
        counterparty_name:
          type:
            - string
            - "null"
        notes:
          type:
            - string
            - "null"
        is_reviewed:
          type:
            - boolean
            - "null"
        tag_ids:
          type: array
          items:
            type: integer
    TransactionDraftCreateRequest:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          description: Positive amount in EUR, for example 12.99.
        date:
          type: string
          format: date
          description: Receipt or expected booking date as YYYY-MM-DD.
        type:
          type: string
          enum:
            - expense
            - income
          description: Draft type. Use expense for normal receipts.
        account_id:
          type: integer
          description: Optional account id from getBudgetLoveMetadata. Omit if the real bank account is not certain yet.
        category_id:
          type: integer
          description: Optional category id from getBudgetLoveMetadata. Omit if uncertain.
        payee:
          type: string
          description: Optional merchant/payee name from the receipt.
        notes:
          type: string
          description: Optional note or OCR summary. The API marks the entry as a receipt draft.
        tag_ids:
          type: array
          items:
            type: integer
          description: Optional tag ids from BudgetLove.
      required:
        - amount
        - date
    TransactionDraftCreateResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Created draft transaction id.
        amount_cents:
          type: integer
          description: Draft amount in cents.
        date:
          type: string
          format: date
          description: Draft date.
        is_reviewed:
          type: boolean
          description: Always false for drafts.
        status:
          type: string
          enum:
            - draft
      required:
        - id
        - amount_cents
        - date
        - is_reviewed
        - status
    ReceiptProcessRequest:
      type: object
      additionalProperties: false
      properties:
        image_base64:
          type: string
          description: Base64 encoded receipt image. If unavailable, do not call this endpoint.
      required:
        - image_base64
    ReceiptProcessResponse:
      type: object
      additionalProperties: false
      properties:
        amount:
          type:
            - number
            - "null"
          description: Extracted amount in EUR, if detected.
        date:
          type:
            - string
            - "null"
          format: date
          description: Extracted receipt date as YYYY-MM-DD, if detected.
        payee:
          type:
            - string
            - "null"
          description: Extracted payee or merchant, if detected.
        suggested_category:
          type:
            - string
            - "null"
          description: Suggested category name, if detected.
        raw_text:
          type: string
          description: Raw OCR text. May be empty if OCR is unavailable.
      required:
        - amount
        - date
        - payee
        - suggested_category
        - raw_text
    PayeeResponse:
      type: object
      additionalProperties: false
      properties:
        payee:
          $ref: "#/components/schemas/Payee"
      required:
        - payee
    PayeeListResponse:
      type: object
      additionalProperties: false
      properties:
        payees:
          type: array
          items:
            $ref: "#/components/schemas/Payee"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - payees
        - limit
        - offset
        - total
    PayeeCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Payee name.
      required:
        - name
    PayeeUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Updated payee name.
    TagResponse:
      type: object
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/Tag"
      required:
        - tag
    TagListResponse:
      type: object
      additionalProperties: false
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - tags
        - limit
        - offset
        - total
    TagCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Tag name.
        color:
          type:
            - string
            - "null"
          description: Optional hex color code or color name.
      required:
        - name
    TagUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Updated tag name.
        color:
          type:
            - string
            - "null"
          description: Updated hex color code or color name, or null to remove color.
    PlannedPayment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        direction:
          type: string
          enum:
            - income
            - expense
        amount_cents:
          type: integer
        amount:
          type: number
        planned_date:
          type: string
          format: date
        status:
          type: string
          enum:
            - open
            - resolved
            - cancelled
        priority:
          type: integer
        is_optional:
          type: boolean
        account_id:
          type:
            - integer
            - "null"
        category_id:
          type:
            - integer
            - "null"
        payee_id:
          type:
            - integer
            - "null"
        note:
          type:
            - string
            - "null"
        resolved_at:
          type:
            - string
            - "null"
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - name
        - direction
        - amount_cents
        - amount
        - planned_date
        - status
        - priority
        - is_optional
        - account_id
        - category_id
        - payee_id
        - note
        - resolved_at
        - created_at
        - updated_at
    PlannedPaymentListResponse:
      type: object
      additionalProperties: false
      properties:
        planned_payments:
          type: array
          items:
            $ref: "#/components/schemas/PlannedPayment"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - planned_payments
        - limit
        - offset
        - total
    PlannedPaymentResponse:
      type: object
      additionalProperties: false
      properties:
        planned_payment:
          $ref: "#/components/schemas/PlannedPayment"
      required:
        - planned_payment
    OpenCase:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum:
            - open
            - resolved
            - cancelled
        reference:
          type:
            - string
            - "null"
        contact_name:
          type:
            - string
            - "null"
        contact_details:
          type:
            - string
            - "null"
        notes:
          type:
            - string
            - "null"
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - title
        - status
        - reference
        - contact_name
        - contact_details
        - notes
        - created_at
        - updated_at
    OpenCaseListResponse:
      type: object
      additionalProperties: false
      properties:
        open_cases:
          type: array
          items:
            $ref: "#/components/schemas/OpenCase"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - open_cases
        - limit
        - offset
        - total
    OpenCaseResponse:
      type: object
      additionalProperties: false
      properties:
        open_case:
          $ref: "#/components/schemas/OpenCase"
      required:
        - open_case
paths:
  /api/meta.php:
    get:
      operationId: getBudgetLoveMetadata
      summary: Get BudgetLove accounts and categories
      description: >
        Fetch accounts, categories and current date context for the token user's
        household. Call this before creating any transaction so that valid IDs
        are used.
      responses:
        "200":
          description: Metadata for the current household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Token user is not linked to a household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/transactions.php:
    get:
      operationId: listBudgetLoveTransactions
      summary: List or inspect BudgetLove transactions
      description: >
        Fetch transaction history for analysis, search, or review. Use this to
        inspect existing bookings before suggesting a new category or fixing a
        misclassified booking.
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: Return a single transaction by id.
        - in: query
          name: date_from
          schema:
            type: string
            format: date
        - in: query
          name: date_to
          schema:
            type: string
            format: date
        - in: query
          name: type
          schema:
            type: string
            enum:
              - income
              - expense
              - transfer
        - in: query
          name: reviewed
          schema:
            type: boolean
        - in: query
          name: account_id
          schema:
            type: integer
        - in: query
          name: category_id
          schema:
            type: integer
        - in: query
          name: payee_id
          schema:
            type: integer
        - in: query
          name: tag_id
          schema:
            type: integer
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Transaction history or a single transaction.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TransactionListResponse"
                  - $ref: "#/components/schemas/TransactionResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBudgetLoveTransaction
      summary: Create a transaction
      description: >
        Create a transaction in BudgetLove. This changes financial data.
        Always show the user the proposed booking first and ask for
        confirmation before calling this action.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreateRequest"
      responses:
        "201":
          description: Transaction created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          description: Invalid request or unknown account/category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBudgetLoveTransaction
      summary: Update an existing transaction
      description: >
        Modify an existing transaction in BudgetLove. Use this when an existing
        booking was categorized incorrectly or needs correction.
      x-openai-isConsequential: true
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
          description: Transaction id to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdateRequest"
      responses:
        "200":
          description: Transaction updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          description: Invalid request or unknown referenced object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transaction not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBudgetLoveTransaction
      summary: Delete a transaction
      description: >
        Permanently delete an existing transaction. Use only after explicit
        user confirmation.
      x-openai-isConsequential: true
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
          description: Transaction id to delete.
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  deleted:
                    type: boolean
                required:
                  - deleted
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transaction not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/transaction_drafts.php:
    post:
      operationId: createBudgetLoveTransactionDraft
      summary: Create a transaction draft
      description: >
        Create an unreviewed transaction draft for a receipt. Use this for
        receipt-first workflows. Later bank statement imports can match the
        real bank transaction to this draft by amount, date window and payee,
        avoiding duplicate bookings.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionDraftCreateRequest"
      responses:
        "201":
          description: Draft transaction created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDraftCreateResponse"
        "400":
          description: Invalid request or unknown account/category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/receipts.php:
    post:
      operationId: processBudgetLoveReceipt
      summary: Process a receipt image
      description: >
        Upload a base64 encoded receipt image and return extracted fields. This
        endpoint does not create a transaction. Use
        createBudgetLoveTransactionDraft for receipt-first workflows, then let
        the bank statement import match/finalize the booking later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptProcessRequest"
      responses:
        "200":
          description: Receipt processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptProcessResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/payees.php:
    get:
      operationId: listBudgetLovePayees
      summary: List or search payees
      description: >
        Fetch payees for the household. Use this to find payee IDs for
        transactions or to verify payee names.
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: Return a single payee by id.
        - in: query
          name: q
          schema:
            type: string
          description: Search payees by name.
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Payee list or a single payee.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PayeeListResponse"
                  - $ref: "#/components/schemas/PayeeResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payee not found (when querying by id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBudgetLovePayee
      summary: Create a new payee
      description: >
        Create a new payee in BudgetLove. Use this to add merchant names
        not yet in the database.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayeeCreateRequest"
      responses:
        "201":
          description: Payee created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayeeResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Payee already exists.
          content:
            application/json:
              schema:
