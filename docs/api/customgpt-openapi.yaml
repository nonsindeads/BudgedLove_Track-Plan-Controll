  /api/planned_payments.php:
    get:
      operationId: listBudgetLovePlannedPayments
      summary: List planned payments
      description: >
        Fetch planned payments for analysis and planning. Use this to see
        upcoming expenses or income, and their current status.
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: Return a single planned payment by id.
        - in: query
          name: status
          schema:
            type: string
            enum:
              - open
              - resolved
              - cancelled
          description: Filter by status.
        - in: query
          name: direction
          schema:
            type: string
            enum:
              - income
              - expense
          description: Filter by direction.
        - in: query
          name: date_from
          schema:
            type: string
            format: date
          description: Filter from planned date.
        - in: query
          name: date_to
          schema:
            type: string
            format: date
          description: Filter to planned date.
        - in: query
          name: account_id
          schema:
            type: integer
        - in: query
          name: category_id
          schema:
            type: integer
        - in: query
          name: payee_id
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Planned payment list or single payment.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlannedPaymentListResponse"
                  - $ref: "#/components/schemas/PlannedPaymentResponse"
        "401":
          description: Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Planned payment not found (when querying by id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
